<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Miss Devises">
  <!--
    LA MARQUE : un billet et une pièce sur une tuile dorée, la couleur des
    pièces, qu'aucune application de la famille ne porte encore.

    LA TUILE ET LE FOND DU MASKABLE VONT PAR PAIRE. Le maskable réduit cette
    image à 87,5 % puis comble le pourtour d'une couleur unie : l'option
    « bg » du script `icons`, dans `package.json`, vaut la teinte EXACTE du
    rectangle ci-dessous, 161,98,7 pour #a16207. La tuile reste unie, sans
    dégradé, pour que ce raccord tienne.

    LA ZONE SÛRE : billet et pièce restent à moins de 25,6 unités du centre
    une fois réduits, donc entiers sous un masque rond.
  -->
  <rect width="64" height="64" rx="14" fill="#a16207" />
  <rect x="9" y="16" width="34" height="22" rx="3" fill="#ffffff" />
  <rect
    x="12.5"
    y="19.5"
    width="27"
    height="15"
    rx="2"
    fill="none"
    stroke="#a16207"
    stroke-width="1.5"
  />
  <circle cx="26" cy="27" r="4.5" fill="none" stroke="#a16207" stroke-width="1.5" />
  <circle cx="43" cy="42" r="10.5" fill="#fde68a" stroke="#ffffff" stroke-width="2" />
  <circle cx="43" cy="42" r="6" fill="none" stroke="#a16207" stroke-width="1.5" />
</svg>
